<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purosangue ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f6f3ee; --card: #ffffff; --ink: #1d1b18; --muted: #6f685d; --line: #e3ddd2;
  --gold: #8a6a2f; --gold-soft: #f3ead8; --good: #2f6b4f; --good-soft: #e3f0e8;
  --warn: #9a5b13; --warn-soft: #fbefdc; --bad: #a3332b; --bad-soft: #f8e3e1; --blue: #2d5f9a; --blue-soft: #e4edf8;
  --radius: 10px; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.04);
  --serif: "EB Garamond", Georgia, serif; --sans: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 var(--sans); }
body { min-height: 100vh; }
a { color: var(--gold); }
button, input, select, textarea { font: inherit; color: inherit; }
.hide { display: none !important; }

header.bar { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.94); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1320px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.brand { font: 600 21px/1 var(--serif); letter-spacing: .2px; margin-right: 6px; white-space: nowrap; }
.brand small { font: 500 11px var(--sans); color: var(--muted); letter-spacing: 1.2px; text-transform: uppercase; margin-left: 6px; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav a { text-decoration: none; color: var(--muted); padding: 7px 11px; border-radius: 8px; font-weight: 500; }
nav a.on { color: var(--ink); background: var(--gold-soft); }
.who { margin-left: auto; display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 13px; }

main { max-width: 1320px; margin: 0 auto; padding: 18px 16px 60px; }
h1 { font: 600 30px/1.15 var(--serif); margin: 0 0 4px; }
h2 { font: 600 21px/1.2 var(--serif); margin: 0 0 10px; }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 1.1px; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
.sub { color: var(--muted); margin: 0 0 16px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
.stack > * + * { margin-top: 14px; }

.btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 500;
  display: inline-flex; gap: 6px; align-items: center; text-decoration: none; color: var(--ink); min-height: 38px; }
.btn:hover { border-color: #cfc6b6; }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn.gold { background: var(--gold); color: #fff; border-color: var(--gold); }
.btn.danger { color: var(--bad); border-color: #e9c4c0; }
.btn.small { padding: 4px 10px; min-height: 30px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }

input[type=text], input[type=search], input[type=email], input[type=password], input[type=date], input[type=number], select, textarea {
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #fff; min-height: 38px; width: 100%; }
textarea { min-height: 80px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--gold-soft); border-color: var(--gold); }

.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
.pill.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.pill b { font-weight: 600; margin-left: 4px; opacity: .7; }

.chip { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #eee; font-weight: 600; white-space: nowrap; }
.chip.incoming { background: var(--blue-soft); color: var(--blue); }
.chip.in_stock { background: var(--good-soft); color: var(--good); }
.chip.reserved { background: var(--warn-soft); color: var(--warn); }
.chip.sold { background: var(--gold-soft); color: var(--gold); }
.chip.returned, .chip.other { background: #eee; color: var(--muted); }
.chip.deleted { background: var(--bad-soft); color: var(--bad); }

.filters { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; margin-bottom: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; cursor: pointer;
  text-align: left; padding: 0; box-shadow: var(--shadow); display: flex; flex-direction: column; }
.tile:hover { border-color: #cdbf9f; }
.tile .pic { aspect-ratio: 1 / 1; background: #f1ede6; display: grid; place-items: center; color: var(--muted); font-size: 13px; overflow: hidden; }
.tile .pic img { width: 100%; height: 100%; object-fit: cover; }
.tile .body { padding: 10px 12px 12px; display: grid; gap: 4px; }
.tile .t { font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.5em; }
.tile .m { color: var(--muted); font-size: 13px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tile .p { font-weight: 600; font-size: 14px; }
.count { color: var(--muted); font-size: 13px; margin: 6px 0 12px; }

/* the watch page */
.watch-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; margin-bottom: 14px; }
.figures { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 12px; }
.figures > div > span { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 600; }
.figures b { font-size: 16px; font-weight: 600; }
.sold-row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.sold-row .count { margin: 0; white-space: nowrap; }
.desc { margin: 10px 0 0; color: var(--muted); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.watch-layout { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.gallery .main { aspect-ratio: 1/1; background: #f1ede6; border-radius: var(--radius); display: grid; place-items: center; overflow: hidden; position: relative; }
.gallery .main img { width: 100%; height: 100%; object-fit: contain; background: #f1ede6; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; margin-top: 10px; }
.thumb { position: relative; aspect-ratio: 1/1; border-radius: 8px; overflow: hidden; border: 2px solid transparent; background: #eee; cursor: pointer; padding: 0; }
.thumb.on { border-color: var(--gold); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .src { position: absolute; left: 3px; bottom: 3px; font-size: 10px; background: rgba(0,0,0,.6); color: #fff; padding: 0 5px; border-radius: 4px; }
.thumb[draggable=true] { cursor: grab; }
.thumb.dragover { outline: 2px dashed var(--gold); }
.drop { display: block; cursor: pointer; border: 2px dashed var(--line); border-radius: var(--radius); padding: 14px; text-align: center; color: var(--muted); margin-top: 10px; }
.drop.over { border-color: var(--gold); background: var(--gold-soft); }
.photo-tools { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; align-items: center; }

dl.fields { display: grid; grid-template-columns: minmax(130px, 38%) 1fr; gap: 6px 12px; margin: 0; }
dl.fields dt { color: var(--muted); font-size: 13px; padding-top: 2px; }
dl.fields dd { margin: 0; overflow-wrap: anywhere; }
.blank { color: #b3ab9d; }
.lock { color: var(--warn); font-size: 12px; margin-left: 6px; cursor: help; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
.form-grid label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.form-grid label.wide { grid-column: 1 / -1; }
.form-grid .hint { font-size: 12px; color: #9a9184; }
.pay { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px; }
.pay label { font-size: 12px; }
.sticky-save { position: sticky; bottom: 0; background: rgba(246,243,238,.96); padding: 10px 0; display: flex; gap: 10px; border-top: 1px solid var(--line); margin-top: 12px; }


table.list { width: 100%; border-collapse: collapse; font-size: 14px; }
table.list th, table.list td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.list th { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); font-weight: 600; }
.tscroll { overflow-x: auto; }
.stat { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat > div { background: #fcfbf8; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.stat b { display: block; font: 600 24px var(--serif); }
.stat span { color: var(--muted); font-size: 12px; }
.progress { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.progress .bar { height: 10px; background: var(--gold-soft); border-radius: 999px; overflow: hidden; margin: 8px 0; }
.progress .bar i { display: block; height: 100%; background: var(--gold); border-radius: 999px; transition: width .6s ease; }
.progress .count { margin: 2px 0 0; }

.flash { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px;
  border-radius: 10px; z-index: 100; max-width: min(560px, calc(100vw - 32px)); box-shadow: 0 6px 24px rgba(0,0,0,.2); }
.flash.bad { background: var(--bad); }

.login { max-width: 380px; margin: 10vh auto; }
.login h1 { text-align: center; margin-bottom: 18px; }
.err { color: var(--bad); font-size: 14px; }
.note { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 13px; }
.note.info { background: var(--blue-soft); color: var(--blue); }

.lightbox { position: fixed; inset: 0; background: rgba(15,14,12,.92); z-index: 90; display: grid; place-items: center; }
.lightbox img { max-width: 94vw; max-height: 86vh; object-fit: contain; }
.lightbox .lb-bar { position: fixed; top: 12px; right: 12px; display: flex; gap: 8px; }
.lightbox .lb-nav { position: fixed; top: 50%; transform: translateY(-50%); }
.lightbox .lb-prev { left: 12px; } .lightbox .lb-next { right: 12px; }

@media (max-width: 900px) {
  .watch-layout { grid-template-columns: 1fr; }
  .filters { grid-template-columns: 1fr 1fr; }
  .filters .q { grid-column: 1 / -1; }
}
@media (max-width: 640px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .form-grid { grid-template-columns: 1fr; }
  dl.fields { grid-template-columns: minmax(110px, 42%) 1fr; }
  h1 { font-size: 25px; }
  input, select, textarea { font-size: 16px !important; }
  .who span { display: none; }
  .bar-in { gap: 8px; padding: 8px 12px; }
  .brand { order: 1; } .who { order: 2; } nav { order: 3; width: 100%; overflow-x: auto; flex-wrap: nowrap; }
  nav a { white-space: nowrap; padding: 6px 10px; }
}

/* The converter under every price (fxchip.js), as in InvoiceWEB. BLUE, and
   only the converter wears it. The arrow is a pseudo-element, so it adds no
   text to the price it sits beside. */
.fx-p { white-space: nowrap; }
.fx-chip { display: inline-block; vertical-align: middle; width: 16px; height: 16px; margin-left: 4px;
  border-radius: 50%; background: #E8F0FC; border: 1px solid #C9DAF6; cursor: pointer; position: relative;
  line-height: 0; font-size: 0; transform: translateY(-1px); }
.fx-chip::before { content: ''; position: absolute; left: 50%; top: 55%; transform: translate(-50%, -50%);
  border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid #2D6BCF; }
.fx-chip:hover { background: #D6E4FA; border-color: #2D6BCF; }
.fx-chip:focus-visible { outline: 2px solid #2D6BCF; outline-offset: 2px; }
.fx-pop { position: fixed; z-index: 400; width: min(300px, calc(100vw - 32px)); padding: 12px 14px;
  background: var(--card); border: 1px solid #C9DAF6; border-radius: var(--radius);
  box-shadow: 0 8px 28px rgba(0,0,0,.12); font: 13.5px/1.45 var(--sans); color: var(--ink); text-transform: none; letter-spacing: 0; }
.fx-pop-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px;
  font-family: var(--serif); font-size: 18px; }
.fx-pop-x { border: 0; background: none; font-size: 18px; line-height: 1; color: var(--muted); cursor: pointer; padding: 2px 4px; }
.fx-pop-list { display: grid; gap: 3px; padding: 6px 0 8px; border-bottom: 1px solid var(--line); }
.fx-pop-row { display: flex; justify-content: space-between; gap: 10px; font-variant-numeric: tabular-nums; }
.fx-pop-row span { color: var(--muted); font-weight: 600; letter-spacing: .04em; }
.fx-pop-bar { display: grid; grid-template-columns: 1fr auto auto auto; gap: 6px; align-items: center; margin-top: 10px; }
.fx-pop-bar input, .fx-pop-bar select { min-width: 0; padding: 6px 8px; font: inherit; font-size: 13px;
  border: 1px solid var(--line); border-radius: 7px; background: var(--paper); }
.fx-pop-bar span { color: var(--muted); }
.fx-pop-out { margin-top: 8px; font-family: var(--serif); font-size: 19px; color: #2D6BCF; font-variant-numeric: tabular-nums; }
.fx-pop-foot { margin-top: 8px; font-size: 11.5px; color: var(--muted); }
</style>
</head>
<body>
<header class="bar hide" id="bar">
  <div class="bar-in">
    <div class="brand">Purosangue <small>ERP</small></div>
    <nav id="nav">
      <a href="#/" data-nav="inventory">Inventory</a>
      <a href="#/new" data-nav="new" data-role="editor">New watch</a>
      <a href="#/import" data-nav="import">Import</a>
      <a href="#/users" data-nav="users" data-role="admin">Users</a>
    </nav>
    <div class="who"><span id="who"></span><button class="btn small" id="logout">Sign out</button></div>
  </div>
</header>
<main id="app"></main>
<script src="/app.js"></script>
<script src="/fxchip.js"></script>
</body>
</html>
