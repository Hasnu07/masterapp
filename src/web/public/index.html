<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purosangue ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f6f3ee; --card: #ffffff; --ink: #1d1b18; --muted: #6f685d; --line: #e3ddd2;
  --gold: #8a6a2f; --gold-soft: #f3ead8; --good: #2f6b4f; --good-soft: #e3f0e8;
  --warn: #9a5b13; --warn-soft: #fbefdc; --bad: #a3332b; --bad-soft: #f8e3e1; --blue: #2d5f9a; --blue-soft: #e4edf8;
  --radius: 10px; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.04);
  --serif: "EB Garamond", Georgia, serif; --sans: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 var(--sans); }
body { min-height: 100vh; }
a { color: var(--gold); }
button, input, select, textarea { font: inherit; color: inherit; }
.hide { display: none !important; }

header.bar { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.94); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1320px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.brand { font: 600 21px/1 var(--serif); letter-spacing: .2px; margin-right: 6px; white-space: nowrap; }
.brand small { font: 500 11px var(--sans); color: var(--muted); letter-spacing: 1.2px; text-transform: uppercase; margin-left: 6px; }
/* The menu: a ☰ in the bar, the pages in a drawer from the left. */
.burger { width: 38px; height: 38px; margin-left: -6px; border: 0; border-radius: 8px; background: none; cursor: pointer;
  display: grid; place-items: center; flex: none; }
.burger:hover { background: var(--gold-soft); }
.burger span, .burger span::before, .burger span::after { display: block; width: 18px; height: 2px; border-radius: 2px;
  background: var(--ink); position: relative; content: ''; }
.burger span::before { position: absolute; top: -6px; }
.burger span::after { position: absolute; top: 6px; }
.scrim { position: fixed; inset: 0; z-index: 55; background: rgba(29,27,24,.28); }
.drawer { position: fixed; top: 0; bottom: 0; left: 0; z-index: 60; width: min(270px, 84vw); background: var(--card);
  border-right: 1px solid var(--line); box-shadow: 4px 0 24px rgba(0,0,0,.08); display: flex; flex-direction: column;
  padding: 10px 12px 16px; transform: translateX(-102%); transition: transform .18s ease; }
.drawer.open { transform: none; }
.drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 14px; }
.drawer-x { border: 0; background: none; font-size: 24px; line-height: 1; color: var(--muted); cursor: pointer; padding: 4px 8px; border-radius: 8px; }
.drawer-x:hover { background: var(--gold-soft); color: var(--ink); }
nav { display: flex; flex-direction: column; gap: 2px; }
nav a { text-decoration: none; color: var(--muted); padding: 10px 12px; border-radius: 8px; font-weight: 500; }
nav a:hover { color: var(--ink); background: var(--paper); }
nav a.on { color: var(--ink); background: var(--gold-soft); }
.who { margin-top: auto; padding: 14px 4px 0; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center;
  justify-content: space-between; color: var(--muted); font-size: 13px; }
.who span { min-width: 0; overflow-wrap: anywhere; }
@media (prefers-reduced-motion: reduce) { .drawer { transition: none; } }

main { max-width: 1320px; margin: 0 auto; padding: 18px 16px 60px; }
h1 { font: 600 30px/1.15 var(--serif); margin: 0 0 4px; }
h2 { font: 600 21px/1.2 var(--serif); margin: 0 0 10px; }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 1.1px; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
.sub { color: var(--muted); margin: 0 0 16px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
.stack > * + * { margin-top: 14px; }

.btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 500;
  display: inline-flex; gap: 6px; align-items: center; text-decoration: none; color: var(--ink); min-height: 38px; }
.btn:hover { border-color: #cfc6b6; }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn.gold { background: var(--gold); color: #fff; border-color: var(--gold); }
.btn.danger { color: var(--bad); border-color: #e9c4c0; }
.btn.small { padding: 4px 10px; min-height: 30px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }

input[type=text], input[type=search], input[type=email], input[type=password], input[type=date], input[type=number], select, textarea {
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #fff; min-height: 38px; width: 100%; }
textarea { min-height: 80px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--gold-soft); border-color: var(--gold); }

.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
.pill.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.pill b { font-weight: 600; margin-left: 4px; opacity: .7; }

.chip { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #eee; font-weight: 600; white-space: nowrap; }
.chip.incoming { background: var(--blue-soft); color: var(--blue); }
.chip.in_stock { background: var(--good-soft); color: var(--good); }
.chip.reserved { background: var(--warn-soft); color: var(--warn); }
.chip.sold { background: var(--gold-soft); color: var(--gold); }
.chip.returned, .chip.other { background: #eee; color: var(--muted); }
.chip.deleted { background: var(--bad-soft); color: var(--bad); }

.filters { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; margin-bottom: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; cursor: pointer;
  text-align: left; padding: 0; box-shadow: var(--shadow); display: flex; flex-direction: column; }
.tile:hover { border-color: #cdbf9f; }
.tile .pic { aspect-ratio: 1 / 1; background: #f1ede6; display: grid; place-items: center; color: var(--muted); font-size: 13px; overflow: hidden; }
.tile .pic img { width: 100%; height: 100%; object-fit: cover; }
.tile .body { padding: 10px 12px 12px; display: grid; gap: 4px; }
.tile .t { font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.5em; }
.tile .m { color: var(--muted); font-size: 13px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tile .p { font-weight: 600; font-size: 14px; }
.count { color: var(--muted); font-size: 13px; margin: 6px 0 12px; }

/* the watch page */
.watch-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; margin-bottom: 14px; }
.figures { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 12px; }
.figures > div > span { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 600; }
.figures b { font-size: 16px; font-weight: 600; }
table.list.clients tbody tr { cursor: pointer; }
table.list.clients tbody tr:hover { background: var(--paper); }
table.list.clients a { text-decoration: none; }
.xfiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.xfile { display: grid; gap: 6px; align-content: start; }
.xfile a { display: grid; gap: 4px; color: inherit; text-decoration: none; font-size: 13px; }
.xfile img, .xpdf { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); background: #f0ece4; }
.xpdf { display: grid; place-items: center; font-weight: 700; letter-spacing: 1px; color: var(--bad); }
.xname { overflow-wrap: anywhere; color: var(--muted); }
.cw { display: grid; }
.cw-row { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 7px 0;
  border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; font-size: 14px; }
.cw-row:hover { background: var(--paper); }
.cw-row img, .cw-none { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; background: #f0ece4; display: block; }
.cw-price { white-space: nowrap; font-weight: 600; }
.wc { padding: 6px 0; border-bottom: 1px solid var(--line); }
.wc:last-child { border-bottom: 0; }
.wc-line { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 14px; }
.wc-label { color: var(--muted); font-size: 13px; min-width: 84px; }
.wc-act { margin-left: auto; display: flex; gap: 6px; }
.wc-pick { margin-top: 8px; }
.wc-pick input { width: 100%; }
.wc-hits { display: grid; margin-top: 4px; }
.wc-hit { text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 7px 4px; cursor: pointer; font-size: 14px; }
.wc-hit:hover { background: var(--gold-soft); }
.sold-row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.sold-row .count { margin: 0; white-space: nowrap; }
.desc { margin: 10px 0 0; color: var(--muted); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.watch-layout { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.gallery .main { aspect-ratio: 1/1; background: #f1ede6; border-radius: var(--radius); display: grid; place-items: center; overflow: hidden; position: relative; }
.gallery .main img { width: 100%; height: 100%; object-fit: contain; background: #f1ede6; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; margin-top: 10px; }
.thumb { position: relative; aspect-ratio: 1/1; border-radius: 8px; overflow: hidden; border: 2px solid transparent; background: #eee; cursor: pointer; padding: 0; }
.thumb.on { border-color: var(--gold); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .src { position: absolute; left: 3px; bottom: 3px; font-size: 10px; background: rgba(0,0,0,.6); color: #fff; padding: 0 5px; border-radius: 4px; }
.thumb[draggable=true] { cursor: grab; }
.thumb.dragover { outline: 2px dashed var(--gold); }
.drop { display: block; cursor: pointer; border: 2px dashed var(--line); border-radius: var(--radius); padding: 14px; text-align: center; color: var(--muted); margin-top: 10px; }
.drop.over { border-color: var(--gold); background: var(--gold-soft); }
.photo-tools { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; align-items: center; }

dl.fields { display: grid; grid-template-columns: minmax(130px, 38%) 1fr; gap: 6px 12px; margin: 0; }
dl.fields dt { color: var(--muted); font-size: 13px; padding-top: 2px; }
dl.fields dd { margin: 0; overflow-wrap: anywhere; }
.blank { color: #b3ab9d; }
.lock { color: var(--warn); font-size: 12px; margin-left: 6px; cursor: help; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
.form-grid label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.form-grid label.wide { grid-column: 1 / -1; }
.form-grid .hint { font-size: 12px; color: #9a9184; }
.pay { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px; }
.pay label { font-size: 12px; }
.sticky-save { position: sticky; bottom: 0; background: rgba(246,243,238,.96); padding: 10px 0; display: flex; gap: 10px; border-top: 1px solid var(--line); margin-top: 12px; }


table.list { width: 100%; border-collapse: collapse; font-size: 14px; }
table.list th, table.list td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.list th { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); font-weight: 600; }
.tscroll { overflow-x: auto; }
.stat { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat > div { background: #fcfbf8; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.stat b { display: block; font: 600 24px var(--serif); }
.stat span { color: var(--muted); font-size: 12px; }
.progress { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.progress .bar { height: 10px; background: var(--gold-soft); border-radius: 999px; overflow: hidden; margin: 8px 0; }
.progress .bar i { display: block; height: 100%; background: var(--gold); border-radius: 999px; transition: width .6s ease; }
.progress .count { margin: 2px 0 0; }

/* A panel that folds: closed until opened, the arrow at the right of its heading (app.js fold()). */
details.fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary h3 { margin: 0; }
details.fold > summary:hover h3 { color: var(--ink); }
details.fold > summary::after { content: ''; flex: none; width: 8px; height: 8px; margin: 0 4px 4px 0;
  border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .15s ease; }
details.fold[open] > summary::after { transform: rotate(-135deg); margin: 4px 4px 0 0; }
details.fold[open] > summary { margin-bottom: 10px; }
details.fold > summary:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 4px; border-radius: 4px; }
.fold-note { text-transform: none; letter-spacing: 0; font-weight: 400; }
/* Inside Logistics: What it cost, History and Records, each a button opening its own section. */
.lg-folds { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 2px; }
.lg-fold-btn { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px; color: var(--ink); }
.lg-fold-btn:hover { border-color: #cfc6b6; }
.lg-fold-btn::after { content: ''; width: 6px; height: 6px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted);
  transform: rotate(45deg); margin: 0 1px 3px 0; transition: transform .15s ease; }
.lg-fold-btn[aria-expanded="true"] { background: var(--gold-soft); border-color: #e6d6b5; }
.lg-fold-btn[aria-expanded="true"]::after { transform: rotate(-135deg); margin: 3px 1px 0 0; }
.lg-section { margin-top: 14px; }
.lg-section > h3 { margin-bottom: 6px; }

/* the logistics Overview: a glance first (.ux-profile.md) — tiles, then search, then each list one line per thing */
.ov-asof { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 8px; color: var(--muted); font-size: 14px; }
.ov-live { font-size: 12px; font-weight: 600; color: var(--good); background: var(--good-soft); border: 1px solid #cfe3d6; border-radius: 999px; padding: 1px 9px 1px 20px; position: relative; }
.ov-live::before { content: ''; position: absolute; left: 8px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%; background: var(--good); }
.ov-stale { font-size: 12px; font-weight: 600; color: var(--warn); background: var(--warn-soft); border: 1px solid #f0dcbf; border-radius: 999px; padding: 1px 9px; }
.ov-banner { margin-bottom: 16px; padding: 12px 16px; border-radius: var(--radius); background: var(--bad-soft); border: 1px solid #eccbc7; color: var(--bad); font-size: 16px; }
.ov-banner:empty { display: none; }
.ov-strong, .ov-form-title { font-weight: 600; }

.ov-tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.ov-tile { position: relative; display: grid; gap: 4px; align-content: start; min-height: 112px; padding: 14px 16px 14px 20px; color: var(--ink); text-decoration: none;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.ov-tile::before { content: ''; position: absolute; left: 0; top: 16px; bottom: 16px; width: 4px; border-radius: 0 4px 4px 0; background: var(--line); }
.ov-tile.blue::before { background: var(--blue); }
.ov-tile.good::before { background: var(--good); }
.ov-tile.warn::before { background: var(--warn); }
.ov-tile.bad { background: var(--bad-soft); border-color: #eccbc7; }
.ov-tile.bad::before { background: var(--bad); }
.ov-tile.bad b { color: var(--bad); }
.ov-tile.bad small { color: var(--ink); }
.ov-tile:hover { border-color: #cdbf9f; }
.ov-tile-label { font-size: 16px; font-weight: 600; }
.ov-tile b { font: 600 34px/1.1 var(--serif); }
.ov-tile small { font-size: 14px; color: var(--muted); }
.ov-skel-tile { background: #f1ede6; border-color: #f1ede6; box-shadow: none; }
.ov-skel-tile::before { display: none; }

.ov-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 16px; align-items: start; }
.ov-stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.ov-panel { padding: 18px 20px; }
.ov-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px 16px; }
.ov-h { font: 600 18px/1.25 var(--sans); margin: 0; color: var(--ink); }
.ov-n { margin-left: 6px; color: var(--muted); font-weight: 500; }
.ov-more, .ov-all { color: var(--gold); font-size: 14px; font-weight: 500; text-decoration: none; }
.ov-more:hover, .ov-all:hover { text-decoration: underline; }
.ov-explain { margin: 4px 0 10px; color: var(--muted); font-size: 14px; }
.ov-explain:empty { display: none; }
.ov-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.ov-row-main { flex: 1; min-width: 0; }
.ov-row-side { flex: none; }
.ov-title { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--ink); font-size: 16px; font-weight: 600; text-decoration: none; }
.ov-title:hover { color: var(--gold); text-decoration: underline; }
.ov-meta { display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 2px; color: var(--muted); font-size: 14px; }
.ov-meta:empty, .ov-meta > span:empty { display: none; }
.ov-warn-text { color: var(--warn); font-weight: 500; }
.ov-all { display: block; padding-top: 10px; border-top: 1px solid var(--line); }
.ov-all-btn { width: 100%; padding: 10px 0 0; background: none; border: 0; border-top: 1px solid var(--line); font: inherit; font-size: 14px; text-align: left; cursor: pointer; }
.ov-empty { margin: 0; padding: 12px 0 2px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
.ov-skel { height: 14px; margin: 14px 0; border-radius: 6px; background: #f1ede6; }
.ov-skel:first-child { width: 45%; height: 18px; margin-top: 2px; }

.ov-donut { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin-top: 8px; }
.ov-legend { display: grid; gap: 10px; flex: 1; min-width: 200px; }
.ov-legend div { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 8px; align-items: center; font-size: 16px; }
.ov-legend i { width: 10px; height: 10px; border-radius: 50%; display: block; }
.ov-legend b { font-weight: 600; }
.ov-legend small { color: var(--muted); font-size: 14px; min-width: 34px; text-align: right; }

.ov-places { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.ov-place { display: grid; gap: 2px; align-content: start; padding: 10px 12px; color: var(--ink); text-decoration: none; background: #fcfbf8; border: 1px solid var(--line); border-radius: 8px; }
.ov-place:hover { border-color: #cdbf9f; }
.ov-place b { font: 600 26px/1.1 var(--serif); }
.ov-place span { font-size: 14px; font-weight: 600; }
.ov-place small { color: var(--muted); font-size: 14px; }

.ov-cost-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px 16px; margin-top: 6px; }
.ov-cost-total { font: 600 34px/1.2 var(--serif); color: var(--ink); }
.ov-cost-in { display: flex; align-items: center; gap: 8px; margin: 0; color: var(--muted); font-size: 14px; }
.ov-cost-in select { width: auto; min-height: 36px; padding: 2px 8px; }
.ov-curtable { width: 100%; border-collapse: collapse; font-size: 14px; }
.ov-curtable th, .ov-curtable td { padding: 8px 8px 8px 0; border-top: 1px solid var(--line); text-align: left; font-weight: 400; font-variant-numeric: tabular-nums; }
.ov-curtable th { font-weight: 600; }
.ov-curtable td:last-child { padding-right: 0; color: var(--muted); text-align: right; }

.ov-acc-nums { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.ov-acc-nums div { display: grid; gap: 2px; padding: 10px 12px; background: #fcfbf8; border: 1px solid var(--line); border-radius: 8px; }
.ov-acc-nums b { font: 600 30px/1.1 var(--serif); }
.ov-acc-nums span { color: var(--muted); font-size: 14px; }
.ov-acc-nums .give { color: var(--bad); }
.ov-acc-nums .owed { color: var(--good); }

.ov-feed { list-style: none; margin: 0; padding: 0; }

/* a client's logistics situation: the Logistics → Clients tab, a logistics client's page, and our client's page */

/* logistics: its own tabs across the top, its lists' kinds in a row under them */
.lg-head { display: flex; gap: 10px 16px; align-items: baseline; flex-wrap: wrap; }
.lg-head h1 { margin: 0; }
.lg-tabs { display: flex; gap: 2px; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; border-bottom: 1px solid var(--line); margin: 10px 0 16px; }
.lg-tabs a { white-space: nowrap; padding: 9px 13px; text-decoration: none; color: var(--muted); font-weight: 500; font-size: 14.5px;
  border-bottom: 2px solid transparent; margin-bottom: -1px; }
.lg-tabs a:hover { color: var(--ink); }
.lg-tabs a.on { color: var(--ink); border-bottom-color: var(--gold); }
.lg-title { font-size: 26px; margin: 4px 0 6px; }
.lg-subtabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
.lg-subtabs .pill { font-size: 13px; }
.lg-toolbar { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; margin-bottom: 10px; }
@media (max-width: 640px) { .lg-toolbar { grid-template-columns: 1fr auto; } .lg-toolbar .q { grid-column: 1 / -1; } }
.lg-now { margin-top: 10px; padding: 9px 12px; border-radius: 8px; background: var(--paper); border: 1px solid var(--line); font-size: 14px; }
.lg-now:empty { display: none; }
.lg-now .h { font-weight: 600; color: var(--ink); text-decoration: none; }
.lg-now a.h:hover { text-decoration: underline; }
.lg-now.here { background: var(--good-soft); border-color: #cfe3d6; }
.lg-now.moving { background: var(--blue-soft); border-color: #cddcf0; }
.lg-now.away { background: var(--warn-soft); border-color: #f0dcbf; }
.lg-now.sold { background: var(--gold-soft); border-color: #e6d6b5; }
.lg-ov { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.lg-tag { font-size: 12.5px; padding: 3px 9px; border-radius: 999px; background: #fff; border: 1px solid var(--line); color: var(--ink); text-decoration: none; }
.lg-tag.warn { background: var(--warn-soft); color: var(--warn); border-color: #f0dcbf; }
.lg-tag.problem { background: var(--bad-soft); color: var(--bad); border-color: #ecc9c5; }

.lg-tl { list-style: none; margin: 0; padding: 0; }
.lg-tl li { display: grid; grid-template-columns: 8.5em minmax(0, 1fr); gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }

.lg-sub > .lg-entry { padding: 6px 0 6px 10px; border-left: 2px solid var(--line); margin-bottom: 6px; }

table.list.lg tbody tr { cursor: pointer; }

.chip.lg-good { background: var(--good-soft); color: var(--good); }
.chip.lg-warn { background: var(--warn-soft); color: var(--warn); }
.chip.lg-blue { background: var(--blue-soft); color: var(--blue); }

.flash { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px;
  border-radius: 10px; z-index: 100; max-width: min(560px, calc(100vw - 32px)); box-shadow: 0 6px 24px rgba(0,0,0,.2); }

/* The converter under every price (fxchip.js), as in InvoiceWEB. BLUE, and
   only the converter wears it. The arrow is a pseudo-element, so it adds no
   text to the price it sits beside. */
.fx-p { white-space: nowrap; }
.fx-chip { display: inline-block; vertical-align: middle; width: 16px; height: 16px; margin-left: 4px;
  border-radius: 50%; background: #E8F0FC; border: 1px solid #C9DAF6; cursor: pointer; position: relative;
  line-height: 0; font-size: 0; transform: translateY(-1px); }
.fx-chip::before { content: ''; position: absolute; left: 50%; top: 55%; transform: translate(-50%, -50%);
  border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid #2D6BCF; }
.fx-chip:hover { background: #D6E4FA; border-color: #2D6BCF; }
.fx-chip:focus-visible { outline: 2px solid #2D6BCF; outline-offset: 2px; }
.fx-pop { position: fixed; z-index: 400; width: min(300px, calc(100vw - 32px)); padding: 12px 14px;
  background: var(--card); border: 1px solid #C9DAF6; border-radius: var(--radius);
  box-shadow: 0 8px 28px rgba(0,0,0,.12); font: 13.5px/1.45 var(--sans); color: var(--ink); text-transform: none; letter-spacing: 0; }
.fx-pop-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px;
  font-family: var(--serif); font-size: 18px; }
.fx-pop-x { border: 0; background: none; font-size: 18px; line-height: 1; color: var(--muted); cursor: pointer; padding: 2px 4px; }
.fx-pop-list { display: grid; gap: 3px; padding: 6px 0 8px; border-bottom: 1px solid var(--line); }
.fx-pop-row { display: flex; justify-content: space-between; gap: 10px; font-variant-numeric: tabular-nums; }
.fx-pop-row span { color: var(--muted); font-weight: 600; letter-spacing: .04em; }
.fx-pop-bar { display: grid; grid-template-columns: 1fr auto auto auto; gap: 6px; align-items: center; margin-top: 10px; }
.fx-pop-bar input, .fx-pop-bar select { min-width: 0; padding: 6px 8px; font: inherit; font-size: 13px;
  border: 1px solid var(--line); border-radius: 7px; background: var(--paper); }
.fx-pop-bar span { color: var(--muted); }
.fx-pop-out { margin-top: 8px; font-family: var(--serif); font-size: 19px; color: #2D6BCF; font-variant-numeric: tabular-nums; }
.fx-pop-foot { margin-top: 8px; font-size: 11.5px; color: var(--muted); }
</style>
