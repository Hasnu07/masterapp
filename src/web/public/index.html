<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purosangue ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f6f3ee; --card: #ffffff; --ink: #1d1b18; --muted: #6f685d; --line: #e3ddd2;
  --gold: #8a6a2f; --gold-soft: #f3ead8; --good: #2f6b4f; --good-soft: #e3f0e8;
  --warn: #9a5b13; --warn-soft: #fbefdc; --bad: #a3332b; --bad-soft: #f8e3e1; --blue: #2d5f9a; --blue-soft: #e4edf8;
  --side-bg: #1b1a1f; --side-ink: #cfcbc3; --side-on: #ffffff; --side-w: 232px; --side-w-min: 64px;
  --radius: 10px; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.04);
  --serif: "EB Garamond", Georgia, serif; --sans: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 var(--sans); }
body { min-height: 100vh; }
a { color: var(--gold); }
button, input, select, textarea { font: inherit; color: inherit; }
.hide { display: none !important; }

svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* The shell (asked 3 Nov 2026, "a sticky open side bar … like chronokey"): the menu as a dark column down the left,
   sticky, that folds to its icons and remembers it; the bar and the page beside it. On a phone the same column is a
   drawer from the ☰ in the bar (menu() in app.js), closed by the scrim, × or Esc. */
.shell { display: flex; min-height: 100vh; }
aside.side { position: sticky; top: 0; height: 100vh; width: var(--side-w); flex: none; background: var(--side-bg); color: var(--side-ink);
  display: flex; flex-direction: column; transition: width .18s ease; overflow: hidden; z-index: 30; }
.side-head { display: flex; align-items: center; gap: 10px; padding: 14px 12px 14px 16px; border-bottom: 1px solid rgba(255,255,255,.08); min-height: 64px; }
.side-head .brand { color: #fff; font: 600 20px/1 var(--serif); white-space: nowrap; overflow: hidden; flex: 1; }
.side-head .brand small { display: block; font: 500 10px var(--sans); color: var(--side-ink); letter-spacing: 1.4px; text-transform: uppercase; margin-top: 4px; }
.side-head .mark { width: 32px; height: 32px; flex: none; border-radius: 8px; background: var(--gold); color: #fff; display: grid; place-items: center;
  font: 600 17px/1 var(--serif); }
.fold, .drawer-x { border: 0; background: transparent; color: var(--side-ink); cursor: pointer; border-radius: 8px; padding: 6px; display: grid; place-items: center; }
.fold:hover, .drawer-x:hover { background: rgba(255,255,255,.08); color: #fff; }
.drawer-x { display: none; font-size: 24px; line-height: 1; padding: 2px 8px; }
.side nav { display: flex; flex-direction: column; gap: 2px; padding: 10px 8px; }
.side nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: var(--side-ink); text-decoration: none;
  font-size: 12.5px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; }
.side nav a:hover { background: rgba(255,255,255,.07); color: #fff; }
.side nav a.on { background: rgba(255,255,255,.1); color: var(--side-on); box-shadow: inset 3px 0 0 var(--gold); }
.side nav a .lbl { overflow: hidden; text-overflow: ellipsis; }
/* Inventory's parts under it, as Chrono Key's menu has them (asked 3 Nov 2026): In stock, Incoming, Sold, Returned, Other,
   All stock — folded away behind an arrow on the Inventory row until it is tapped (same day), and remembered. */
.side nav .navrow { display: flex; align-items: center; }
.side nav .navrow a { flex: 1; min-width: 0; }
.side nav .chev { flex: none; width: 30px; height: 30px; margin-left: 2px; border: 0; border-radius: 8px; background: transparent; color: var(--side-ink);
  cursor: pointer; display: grid; place-items: center; }
.side nav .chev:hover { background: rgba(255,255,255,.08); color: #fff; }
.side nav .chev svg.i { width: 16px; height: 16px; transition: transform .18s ease; }
.side nav .chev[aria-expanded="true"] svg.i { transform: rotate(180deg); }
.side nav .subnav { display: none; flex-direction: column; margin: -2px 0 4px; }
.side nav .subnav.open { display: flex; }
.side nav .subnav a { position: relative; padding: 6px 12px 6px 42px; font-size: 12px; font-weight: 500; letter-spacing: .4px; text-transform: none; opacity: .85; }
.side nav .subnav a::before { content: ''; position: absolute; left: 28px; top: 50%; width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .45; transform: translateY(-50%); }
.side nav .subnav a.on { color: #fff; background: rgba(255,255,255,.06); box-shadow: none; opacity: 1; }
.side nav .subnav a.on::before { background: var(--gold); opacity: 1; }
body.folded .side nav .subnav, body.folded .side nav .chev { display: none; }
@media (prefers-reduced-motion: reduce) { .side nav .chev svg.i { transition: none; } }
.side-foot { margin-top: auto; padding: 12px; border-top: 1px solid rgba(255,255,255,.08); display: flex; flex-direction: column; gap: 8px; }
.side-foot .who { font-size: 12.5px; color: var(--side-ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-foot .who b { display: block; color: #fff; font-weight: 600; }
.side-foot .btn { background: transparent; color: var(--side-ink); border-color: rgba(255,255,255,.18); justify-content: center; }
.side-foot .btn:hover { color: #fff; border-color: rgba(255,255,255,.4); }
/* Folded: the icons alone, each named on hover. */
body.folded aside.side { width: var(--side-w-min); }
body.folded .side-head { padding: 14px 0; justify-content: center; }
body.folded .side-head .brand, body.folded .side-head .mark, body.folded .side nav a .lbl, body.folded .side-foot .who, body.folded .side-foot .btn .lbl { display: none; }
body.folded .side nav a { justify-content: center; padding: 11px 0; }
body.folded .side-foot .btn { padding: 6px; }
/* Signed out: the sign-in form alone. */
body.out aside.side, body.out header.bar { display: none; }
@media (prefers-reduced-motion: reduce) { aside.side { transition: none; } }

.page { flex: 1; min-width: 0; display: flex; flex-direction: column; }
header.bar { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.bar-in { padding: 12px 20px; display: flex; gap: 14px; align-items: center; min-height: 58px; }
.crumb { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.crumb h1 { font: 600 17px/1 var(--sans); letter-spacing: 1.6px; text-transform: uppercase; margin: 0; white-space: nowrap; }
.crumb .path { font-size: 11px; color: var(--muted); letter-spacing: 1.2px; text-transform: uppercase; border-left: 1px solid var(--line); padding-left: 12px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.burger { width: 38px; height: 38px; margin-left: -6px; border: 0; border-radius: 8px; background: none; cursor: pointer;
  display: none; place-items: center; flex: none; }
.burger:hover { background: var(--gold-soft); }
.burger span, .burger span::before, .burger span::after { display: block; width: 18px; height: 2px; border-radius: 2px;
  background: var(--ink); position: relative; content: ''; }
.burger span::before { position: absolute; top: -6px; }
.burger span::after { position: absolute; top: 6px; }
.scrim { position: fixed; inset: 0; z-index: 55; background: rgba(29,27,24,.28); }
@media (max-width: 760px) {
  aside.side { position: fixed; left: 0; top: 0; bottom: 0; height: auto; width: var(--side-w) !important; z-index: 60; transform: translateX(-102%);
    transition: transform .18s ease; box-shadow: 4px 0 24px rgba(0,0,0,.2); }
  aside.side.open { transform: none; }
  body.folded .side-head { padding: 14px 12px 14px 16px; justify-content: flex-start; }
  body.folded .side-head .brand, body.folded .side-head .mark, body.folded .side nav a .lbl, body.folded .side-foot .who, body.folded .side-foot .btn .lbl { display: revert; }
  body.folded .side nav a { justify-content: flex-start; padding: 10px 12px; }
  body.folded .side nav .subnav.open { display: flex; }
  body.folded .side nav .chev { display: grid; }
  body.folded .side nav .subnav a { padding: 6px 12px 6px 42px; }
  .fold { display: none; }
  .drawer-x { display: grid; }
  .burger { display: grid; }
  .crumb .path { display: none; }
}

/* The console fills the screen (asked 27 Oct 2026: "wide screen the whole app instead of aligned at middle"). */
main { width: 100%; padding: 18px 20px 60px; }
/* The logistics app itself, inside the ERP (asked 30 Oct 2026): one frame filling the screen under the bar; its height is set by lgAppFit(). */
#lg-app-host, #acc-app-host { width: 100%; background: #f4f3fb; }
#acc-app-host { background: #0c0b09; }
#lg-app-host iframe, #acc-app-host iframe { display: block; width: 100%; height: 100%; border: 0; }
/* The watch's logistics as a window in the console's look (showLogisticsWindow): one line on where it is, then its story. */
.lgw { width: min(920px, 94vw); max-height: 92vh; padding: 0; border: 0; border-radius: 14px; background: var(--card); color: var(--ink);
  box-shadow: 0 24px 64px rgba(0,0,0,.35); overflow: hidden; }
.lgw[open] { display: grid; grid-template-rows: auto minmax(0, 1fr); }
.lgw::backdrop { background: rgba(29,27,24,.5); }
.lgw-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 18px 24px 14px; border-bottom: 1px solid var(--line); }
.lgw-eyebrow { font-size: 13px; color: var(--muted); }
.lgw-head h2 { font: 600 24px/1.15 var(--serif); margin: 2px 0 2px; }
.lgw-body { overflow: auto; padding: 6px 24px 24px; }
.lgw-wait { padding: 24px 0; }
.lgw-now { font: 600 24px/1.25 var(--serif); margin: 14px 0 10px; }
.lgw-now.sold { color: var(--gold); }
.lgw-now.moving { color: var(--blue); }
.lgw-now.warn { color: var(--warn); }
.lgw-now.here { color: var(--good); }
.lgw-now.quiet { color: var(--muted); font-weight: 500; }
.lgw-facts { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 14px; }
.lgw-facts .k { color: var(--muted); }
.lgw h3 { font: 600 18px/1.2 var(--serif); text-transform: none; letter-spacing: 0; color: var(--ink); margin: 24px 0 10px; }
.lgw-tl { list-style: none; margin: 0; padding: 0; }
.lgw-tl li { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 4px 14px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.lgw-tl li:last-child { border-bottom: 0; }
.lgw-tl time { color: var(--muted); font-size: 13px; padding-top: 2px; }
.lgw-ev { font-weight: 600; font-size: 15px; }
.lgw-tl li.sold .lgw-ev { color: var(--gold); }
.lgw-tl li.moving .lgw-ev { color: var(--blue); }
.lgw-tl li.warn .lgw-ev { color: var(--warn); }
.lgw-d { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.lgw-pics { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.lgw-pic { position: relative; display: block; width: 88px; height: 88px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: #f0ece4; }
.lgw-pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.lgw-pic span { position: absolute; left: 0; right: 0; bottom: 0; font-size: 12px; padding: 2px 6px; background: rgba(0,0,0,.55); color: #fff; }
/* A PDF among the papers, in a viewer over the window: the name and Download at the top, the paper filling the rest. */
.lgdoc { width: min(1100px, 96vw); height: 94vh; max-height: 94vh; padding: 0; border: 0; border-radius: 14px; background: var(--card); color: var(--ink);
  box-shadow: 0 24px 64px rgba(0,0,0,.4); overflow: hidden; }
.lgdoc[open] { display: grid; grid-template-rows: auto minmax(0, 1fr); }
.lgdoc::backdrop { background: rgba(29,27,24,.6); }
.lgdoc-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.lgdoc-head b { font-weight: 600; overflow-wrap: anywhere; }
.lgdoc iframe { display: block; width: 100%; height: 100%; border: 0; background: #525659; }
@media (max-width: 640px) {
  .lgdoc { width: 100vw; max-width: 100vw; height: 100vh; max-height: 100vh; border-radius: 0; }
  .lgdoc-head { flex-wrap: wrap; }
}
/* A shipment's papers — customs documents, invoices — by name, each opening on its own. */
/* The Accounts window's track of a leg: posted, each payment with its wallet and what was left, the remainder (showAccountsWindow). */
.acc-track { margin-top: 8px; border-top: 1px dashed var(--line); }
.acc-track > div { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.acc-track > div:last-child { border-bottom: 0; }
.acc-track .acc-pay > span:first-child { min-width: 0; }
.acc-track .acc-left { white-space: nowrap; color: var(--muted); }
.acc-track .lgw-total { font-weight: 600; }
/* The watch's Timeline (timeline.js): the three apps' lines on where it stands, then one story with a tag per line saying whose it is. */
.tl-nows { display: grid; gap: 6px; margin: 12px 0 10px; }
.tl-now { font: 500 17px/1.35 var(--serif); }
.tl-now.sold { color: var(--gold); } .tl-now.moving { color: var(--blue); } .tl-now.warn { color: var(--warn); } .tl-now.here { color: var(--good); }
.tl-src { display: inline-block; font: 600 10.5px/1 var(--sans); letter-spacing: .8px; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px 2px; margin-right: 8px; vertical-align: 2px; }
.tl-src.tl-logistics { color: var(--blue); border-color: currentColor; }
.tl-src.tl-accounts { color: var(--gold); border-color: currentColor; }
.tl-src.tl-chronokey, .tl-src.tl-erp { color: var(--ink); }
.tl-printed { display: none; }
@media print {
  body > *:not(#tl-win) { display: none !important; }
  #tl-win, #tl-win[open] { position: static; display: block; width: auto; max-width: none; max-height: none; height: auto; border: 0; box-shadow: none; border-radius: 0; color: #000; background: #fff; }
  #tl-win .lgw-body { overflow: visible; padding: 0; }
  #tl-win .lgw-head { padding: 0 0 10px; }
  .tl-noprint { display: none !important; }
  .tl-printed { display: block; margin-top: 18px; font-size: 12px; color: #666; }
  .lgw-tl li { break-inside: avoid; }
  .lgw-pic { width: 64px; height: 64px; }
  a { color: inherit; text-decoration: none; }
}
.lgw-docs { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 6px; font-size: 13px; }
.lgw-docs a { color: var(--gold); overflow-wrap: anywhere; }
.lgw-pic.gone img { display: none; }
.lgw-pic.gone::before { content: 'picture missing'; position: absolute; inset: 0; display: grid; place-items: center; padding: 6px; text-align: center;
  font-size: 11px; color: var(--muted); }
.lgw-cards { display: grid; gap: 10px; }
.lgw-card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.lgw-card-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.lgw-costs > div { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.lgw-costs > div:last-child { border-bottom: 0; }
.lgw-costs .lgw-total { font-weight: 600; }
.lgw-foot { margin: 24px 0 0; }
@media (max-width: 640px) {
  .lgw { width: 100vw; max-width: 100vw; max-height: 100vh; height: 100vh; border-radius: 0; }
  .lgw-head, .lgw-body { padding-left: 16px; padding-right: 16px; }
  .lgw-tl li { grid-template-columns: 1fr; gap: 2px; }
  .lgw-head .btn { min-height: 44px; }
}
/* The same frame as a window over the watch page: the app's own passport (showLogisticsAppWindow). */
#lg-app-scrim { position: fixed; inset: 0; z-index: 65; background: rgba(29,27,24,.5); }
#lg-app-host.as-window { position: fixed; inset: 4vh 4vw; width: auto; height: auto !important; z-index: 70; background: #fff;
  border-radius: 12px; overflow: hidden; box-shadow: 0 24px 64px rgba(0,0,0,.35); }
.lg-win-x { position: fixed; top: calc(4vh - 18px); right: calc(4vw - 18px); z-index: 71; width: 44px; height: 44px; border-radius: 50%; border: 0;
  background: var(--ink); color: #fff; font-size: 26px; line-height: 1; cursor: pointer; display: grid; place-items: center; }
@media (max-width: 640px) {
  #lg-app-host.as-window { inset: 0; border-radius: 0; }
  .lg-win-x { top: 8px; right: 8px; }
}
@media (max-width: 640px) { main { padding: 14px 16px 60px; } .bar-in { padding: 10px 16px; } }
h1 { font: 600 30px/1.15 var(--serif); margin: 0 0 4px; }
h2 { font: 600 21px/1.2 var(--serif); margin: 0 0 10px; }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 1.1px; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
.sub { color: var(--muted); margin: 0 0 16px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
.stack > * + * { margin-top: 14px; }

.btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 500;
  display: inline-flex; gap: 6px; align-items: center; text-decoration: none; color: var(--ink); min-height: 38px; }
.btn:hover { border-color: #cfc6b6; }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn.gold { background: var(--gold); color: #fff; border-color: var(--gold); }
.btn.danger { color: var(--bad); border-color: #e9c4c0; }
.btn.small { padding: 4px 10px; min-height: 30px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }

input[type=text], input[type=search], input[type=email], input[type=password], input[type=date], input[type=number], select, textarea {
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #fff; min-height: 38px; width: 100%; }
textarea { min-height: 80px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--gold-soft); border-color: var(--gold); }

.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
.pill.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.pill b { font-weight: 600; margin-left: 4px; opacity: .7; }

.chip { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #eee; font-weight: 600; white-space: nowrap; }
.chip.incoming { background: var(--blue-soft); color: var(--blue); }
.chip.in_stock { background: var(--good-soft); color: var(--good); }
.chip.reserved { background: var(--warn-soft); color: var(--warn); }
.chip.sold { background: var(--gold-soft); color: var(--gold); }
.chip.returned, .chip.other { background: #eee; color: var(--muted); }
.chip.deleted { background: var(--bad-soft); color: var(--bad); }
.chip.insafe { background: var(--blue-soft); color: var(--blue); white-space: normal; }

.filters { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; margin-bottom: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
/* The Inventory card as Chrono Key's (asked 3 Nov 2026, "the cards to be this size and have buttons as info"): the
   picture with the status over it, the facts one under the other, a row of buttons. Six a row at most (then, the same
   day: eleven across a wide screen was "too many watches, less readability"), fewer as the screen narrows.
   Colour still says status only — the badge, and the line along the foot. */
#grid { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1500px) { #grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
@media (max-width: 1200px) { #grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 900px) { #grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 640px) { #grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }
@media (max-width: 420px) { #grid { grid-template-columns: minmax(0, 1fr); } }
.tile { background: var(--card); border: 1px solid var(--line); border-bottom: 3px solid var(--line); border-radius: 4px; overflow: hidden; cursor: pointer;
  text-align: left; padding: 0; box-shadow: var(--shadow); display: flex; flex-direction: column; position: relative; }
.tile:hover { border-color: #cdbf9f; }
.tile.st-in_stock { border-bottom-color: var(--good); }
.tile.st-incoming { border-bottom-color: var(--blue); }
.tile.st-sold { border-bottom-color: var(--gold); }
.tile.st-deleted { border-bottom-color: var(--bad); }
.tile .pic { aspect-ratio: 1 / 1; background: #f1ede6; display: grid; place-items: center; color: var(--muted); font-size: 13px; overflow: hidden; position: relative; }
.tile .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile .pic-n { position: absolute; top: 8px; right: 8px; background: rgba(29, 27, 24, .78); color: #fff; font-size: 11px; font-weight: 600; padding: 3px 7px; border-radius: 999px; }
.tile .badge { position: absolute; top: 8px; left: 8px; font-size: 10px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; padding: 3px 7px; border-radius: 3px;
  box-shadow: 0 1px 3px rgba(0,0,0,.18); }
.tile .body { padding: 12px 13px 8px; display: grid; gap: 3px; }
.tile .t { font-weight: 700; font-size: 14px; line-height: 1.25; text-transform: uppercase; letter-spacing: .3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
/* Each fact one line: the label small and quiet, the value as written. */
.tile .f { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.6; }
.tile .f .k { font-size: 10.5px; letter-spacing: .6px; text-transform: uppercase; }
.tile .f span { color: var(--ink); font-weight: 500; }
.tile .f.strong span { font-weight: 700; }
.tile .f.sold span { color: var(--gold); font-weight: 700; }
.tile .f .days { display: inline-block; border: 1px solid var(--good); color: var(--good); border-radius: 999px; padding: 0 7px; font-weight: 700; line-height: 1.4; font-style: normal; font-size: 11.5px; }
/* The buttons: the things done with a watch from the list — edit it, see its logistics, open it on Chrono Key, share it. */
.tile .acts { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 13px 12px; margin-top: auto; }
.tile .acts a, .tile .acts button { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 9px; border: 1px solid var(--line); border-radius: 6px;
  background: #fff; color: var(--ink); cursor: pointer; font-size: 12px; font-weight: 600; text-decoration: none; white-space: nowrap; }
.tile .acts a:hover, .tile .acts button:hover { border-color: var(--gold); color: var(--gold); background: var(--gold-soft); }
/* The moves — Received into stock, Sold, Reserve, Return… — stand out from the rest of the row. */
.tile .acts button.move { background: var(--gold-soft); border-color: #d9c9a3; }
/* A move's form over the page (openMove): the same window as Logistics, narrower. */
.lgw.move { width: min(620px, 94vw); max-height: 92vh; }
.lgw.move .lgw-body { padding: 18px 24px 24px; }
.tile .acts a:focus-visible, .tile .acts button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
.tile .acts svg.i { width: 14px; height: 14px; color: var(--muted); }
.tile .acts a:hover svg.i, .tile .acts button:hover svg.i { color: inherit; }
.count { color: var(--muted); font-size: 13px; margin: 6px 0 12px; }

/* the watch page */
/* The watch page as a dossier (30 Oct 2026): one panel with the picture at the left and, beside it, the brand small
   over the model and reference as on a certificate, the status, the watch's own facts in two columns, the note, and
   the money as one ledger line across the foot. The rest of the record and the side panels sit below. */
.back { display: inline-block; margin: 0 0 10px; text-decoration: none; }
/* The head of a client's or an expense's page: the name on the left, the buttons on the right. */
.watch-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; margin-bottom: 14px; }
.dossier { display: grid; grid-template-columns: minmax(280px, 440px) minmax(0, 1fr); gap: 28px 40px; padding: 24px; align-items: start; }
.dossier-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.brand-line { font-size: 15px; color: var(--muted); }
.dossier h1 { font: 600 38px/1.1 var(--serif); margin: 0 0 10px; letter-spacing: -.2px; }
.dossier .row b { font-weight: 600; }
.spec { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 32px; margin: 22px 0 0; max-width: 920px; }
.spec > div { display: grid; grid-template-columns: minmax(96px, 124px) 1fr; gap: 10px; align-items: baseline; }
.spec dt { color: var(--muted); font-size: 13px; }
.spec dd { margin: 0; font-size: 15px; overflow-wrap: anywhere; }
.with { margin: 14px 0 0; font-size: 15px; }
.dossier .desc { margin-top: 14px; }
.dossier .prices { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line); gap: 12px 44px; }
.price.sold b { color: var(--gold); }
/* The prices: the one thing on the watch page set large. What we paid first, in the serif like a page title; what we ask beside it. */
.prices { display: flex; flex-wrap: wrap; gap: 12px 36px; margin-top: 14px; align-items: flex-end; }
.price > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 2px; }
.price b { display: block; font: 600 22px/1.15 var(--serif); letter-spacing: .1px; }
.price.main b { font-size: 30px; }
.price small { display: block; font-size: 13px; color: var(--muted); margin-top: 3px; }
.price.unset b { font: 400 15px/1.3 var(--sans); color: var(--muted); padding-bottom: 3px; }
.price .blank { font: 400 16px var(--sans); }
table.list.clients tbody tr { cursor: pointer; }
table.list.clients tbody tr:hover { background: var(--paper); }
table.list.clients a { text-decoration: none; }
.xfiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.xfile { display: grid; gap: 6px; align-content: start; }
.xfile a { display: grid; gap: 4px; color: inherit; text-decoration: none; font-size: 13px; }
.xfile img, .xpdf { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); background: #f0ece4; }
.xpdf { display: grid; place-items: center; font-weight: 700; letter-spacing: 1px; color: var(--bad); }
.xname { overflow-wrap: anywhere; color: var(--muted); }
.cw { display: grid; }
.cw-row { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 7px 0;
  border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; font-size: 14px; }
.cw-row:hover { background: var(--paper); }
.cw-row img, .cw-none { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; background: #f0ece4; display: block; }
.cw-price { white-space: nowrap; font-weight: 600; }
.wc { padding: 6px 0; border-bottom: 1px solid var(--line); }
.wc:last-child { border-bottom: 0; }
.wc-line { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 14px; }
.wc-label { color: var(--muted); font-size: 13px; min-width: 84px; }
.wc-act { margin-left: auto; display: flex; gap: 6px; }
.wc-pick { margin-top: 8px; }
.wc-pick input { width: 100%; }
.wc-hits { display: grid; margin-top: 4px; }
.wc-hit { text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 7px 4px; cursor: pointer; font-size: 14px; }
.wc-hit:hover { background: var(--gold-soft); }
.sold-row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.sold-row .count { margin: 0; white-space: nowrap; }
.desc { margin: 14px 0 0; color: var(--muted); font-size: 14px; line-height: 1.5; max-width: 72ch; white-space: pre-wrap; overflow-wrap: anywhere; }
/* The watch page (reshaped 30 Oct 2026, "optimal viewing size and easy to understand"): the photos in a column no wider
   than a photo needs, the details beside them in groups that sit two or three across on a wide screen instead of one
   long list, each label close to its value. */
.watch-layout { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr); gap: 20px; align-items: start; margin-top: 20px; }
.gallery .main { aspect-ratio: 1/1; background: #f1ede6; border-radius: var(--radius); display: grid; place-items: center; overflow: hidden; position: relative; }
.gallery .main img { width: 100%; height: 100%; object-fit: contain; background: #f1ede6; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; margin-top: 10px; }
.thumb { position: relative; aspect-ratio: 1/1; border-radius: 8px; overflow: hidden; border: 2px solid transparent; background: #eee; cursor: pointer; padding: 0; }
.thumb.on { border-color: var(--gold); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .src { position: absolute; left: 3px; bottom: 3px; font-size: 12px; background: rgba(0,0,0,.6); color: #fff; padding: 0 5px; border-radius: 4px; }
.thumb[draggable=true] { cursor: grab; }
.thumb.dragover { outline: 2px dashed var(--gold); }
.drop { display: block; cursor: pointer; border: 2px dashed var(--line); border-radius: var(--radius); padding: 14px; text-align: center; color: var(--muted); margin-top: 10px; }
.drop.over { border-color: var(--gold); background: var(--gold-soft); }
.photo-tools { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; align-items: center; }

dl.fields { display: grid; grid-template-columns: minmax(120px, 150px) 1fr; gap: 10px 16px; margin: 0; }
dl.fields dt { color: var(--muted); font-size: 13px; padding-top: 2px; }
dl.fields dd { margin: 0; overflow-wrap: anywhere; font-size: 15px; }
/* The watch's fields by group — Watch, Specification, Purchase, Prices, Sale, Notes — two across where the screen allows,
   each group named in the serif like a heading in a document, not a tracked-out label. Empty fields are hidden (app.js). */
.fgroups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 40px; align-items: start; padding: 20px 24px; }
.fgroup h3 { margin: 0 0 12px; font: 600 19px/1.2 var(--serif); text-transform: none; letter-spacing: 0; color: var(--ink); }
.fempty { grid-column: 1 / -1; margin: 0; }
.linkish { border: 0; background: none; padding: 0; color: var(--gold); text-decoration: underline; cursor: pointer; font-size: 14px; min-height: 44px; }
@media (max-width: 1100px) { .fgroups { grid-template-columns: 1fr; } }
.blank { color: #b3ab9d; }
.lock { color: var(--warn); font-size: 12px; margin-left: 6px; cursor: help; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
.form-grid label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.form-grid label.wide { grid-column: 1 / -1; }
.form-grid .hint { font-size: 12px; color: #9a9184; }
.pay { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px; }
.pay label { font-size: 12px; }
.sticky-save { position: sticky; bottom: 0; background: rgba(246,243,238,.96); padding: 10px 0; display: flex; gap: 10px; border-top: 1px solid var(--line); margin-top: 12px; }


/* Wide enough to read: on a phone a table scrolls inside its panel rather than squeezing each column. */
.tscroll { overflow-x: auto; }
table.list { width: 100%; border-collapse: collapse; font-size: 14px; }
table.list th, table.list td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.list th { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); font-weight: 600; }
.tscroll { overflow-x: auto; }
.stat { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat > div { background: #fcfbf8; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.stat b { display: block; font: 600 24px var(--serif); }
.stat span { color: var(--muted); font-size: 12px; }
.progress { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.progress .bar { height: 10px; background: var(--gold-soft); border-radius: 999px; overflow: hidden; margin: 8px 0; }
.progress .bar i { display: block; height: 100%; background: var(--gold); border-radius: 999px; transition: width .6s ease; }
.progress .count { margin: 2px 0 0; }

/* A panel that folds: closed until opened, the arrow at the right of its heading (app.js fold()). */
details.fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary h3 { margin: 0; }
details.fold > summary:hover h3 { color: var(--ink); }
details.fold > summary::after { content: ''; flex: none; width: 8px; height: 8px; margin: 0 4px 4px 0;
  border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .15s ease; }
details.fold[open] > summary::after { transform: rotate(-135deg); margin: 4px 4px 0 0; }
details.fold[open] > summary { margin-bottom: 10px; }
details.fold > summary:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 4px; border-radius: 4px; }
.fold-note { text-transform: none; letter-spacing: 0; font-weight: 400; }

.flash { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px;
  border-radius: 10px; z-index: 100; max-width: min(560px, calc(100vw - 32px)); box-shadow: 0 6px 24px rgba(0,0,0,.2); }
.flash.bad { background: var(--bad); }
.update-bar { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); z-index: 101; display: flex; gap: 12px; align-items: center;
  background: var(--ink); color: #fff; padding: 8px 10px 8px 16px; border-radius: 10px; max-width: calc(100vw - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.2); }

.login { max-width: 380px; margin: 10vh auto; }
.login h1 { text-align: center; margin-bottom: 18px; }
.err { color: var(--bad); font-size: 14px; }
.note { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 13px; }
.note.info { background: var(--blue-soft); color: var(--blue); }

.lightbox { position: fixed; inset: 0; background: rgba(15,14,12,.92); z-index: 90; display: grid; place-items: center; }
.lightbox img { max-width: 94vw; max-height: 86vh; object-fit: contain; }
.lightbox .lb-bar { position: fixed; top: 12px; right: 12px; display: flex; gap: 8px; }
.lightbox .lb-nav { position: fixed; top: 50%; transform: translateY(-50%); }
.lightbox .lb-prev { left: 12px; } .lightbox .lb-next { right: 12px; }

@media (max-width: 1100px) {
  .watch-layout { grid-template-columns: 1fr; }
}
@media (max-width: 900px) {
  .dossier { grid-template-columns: 1fr; padding: 16px; gap: 18px; }
  .dossier h1 { font-size: 30px; }
  .dossier-top { flex-direction: column; }
  .spec { grid-template-columns: 1fr; }
  .filters { grid-template-columns: 1fr 1fr; }
  .filters .q { grid-column: 1 / -1; }
}
@media (max-width: 640px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .form-grid { grid-template-columns: 1fr; }
  dl.fields { grid-template-columns: minmax(110px, 42%) 1fr; }
  /* Used in the field, by thumb: every button on the watch page is tall enough to hit. */
  .dossier .btn, .photo-tools .btn, .wc-act .btn { min-height: 44px; }
  .tile .acts a, .tile .acts button { height: 38px; }
  h1 { font-size: 25px; }
  input, select, textarea { font-size: 16px !important; }
  .bar-in { gap: 8px; padding: 6px 12px; }
  main { padding: 14px 14px 60px; }
}

/* The converter under every price (fxchip.js), as in InvoiceWEB. BLUE, and
   only the converter wears it. The arrow is a pseudo-element, so it adds no
   text to the price it sits beside. */
.fx-p { white-space: nowrap; }
.fx-chip { display: inline-block; vertical-align: middle; width: 16px; height: 16px; margin-left: 4px;
  border-radius: 50%; background: #E8F0FC; border: 1px solid #C9DAF6; cursor: pointer; position: relative;
  line-height: 0; font-size: 0; transform: translateY(-1px); }
.fx-chip::before { content: ''; position: absolute; left: 50%; top: 55%; transform: translate(-50%, -50%);
  border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid #2D6BCF; }
.fx-chip:hover { background: #D6E4FA; border-color: #2D6BCF; }
.fx-chip:focus-visible { outline: 2px solid #2D6BCF; outline-offset: 2px; }
.fx-pop { position: fixed; z-index: 400; width: min(300px, calc(100vw - 32px)); padding: 12px 14px;
  background: var(--card); border: 1px solid #C9DAF6; border-radius: var(--radius);
  box-shadow: 0 8px 28px rgba(0,0,0,.12); font: 13.5px/1.45 var(--sans); color: var(--ink); text-transform: none; letter-spacing: 0; }
.fx-pop-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px;
  font-family: var(--serif); font-size: 18px; }
.fx-pop-x { border: 0; background: none; font-size: 18px; line-height: 1; color: var(--muted); cursor: pointer; padding: 2px 4px; }
.fx-pop-list { display: grid; gap: 3px; padding: 6px 0 8px; border-bottom: 1px solid var(--line); }
.fx-pop-row { display: flex; justify-content: space-between; gap: 10px; font-variant-numeric: tabular-nums; }
.fx-pop-row span { color: var(--muted); font-weight: 600; letter-spacing: .04em; }
.fx-pop-bar { display: grid; grid-template-columns: 1fr auto auto auto; gap: 6px; align-items: center; margin-top: 10px; }
.fx-pop-bar input, .fx-pop-bar select { min-width: 0; padding: 6px 8px; font: inherit; font-size: 13px;
  border: 1px solid var(--line); border-radius: 7px; background: var(--paper); }
.fx-pop-bar span { color: var(--muted); }
.fx-pop-out { margin-top: 8px; font-family: var(--serif); font-size: 19px; color: #2D6BCF; font-variant-numeric: tabular-nums; }
.fx-pop-foot { margin-top: 8px; font-size: 11.5px; color: var(--muted); }
</style>
</head>

</svg>
<div class="shell">
  <aside class="side" id="drawer" aria-label="Menu">
    <div class="side-head">
      <div class="mark">P</div>
      <div class="brand">Purosangue <small>ERP</small></div>
      <button class="fold" id="fold" type="button" title="Fold the menu to its icons" aria-label="Fold the menu"><svg class="i"><use href="#i-fold"/></svg></button>
      <button class="drawer-x" id="menu-close" type="button" aria-label="Close the menu">×</button>
    </div>
    <nav id="nav">
      <div class="navrow">
        <a href="#/" data-nav="inventory" title="Inventory"><svg class="i"><use href="#i-inventory"/></svg><span class="lbl">Inventory</span></a>
        <button class="chev" id="inv-toggle" type="button" aria-expanded="false" aria-controls="subnav" title="Inventory's parts"><svg class="i"><use href="#i-chev"/></svg></button>
      </div>
      <div class="subnav" id="subnav">
        <a href="#/stock/in_stock" data-stock="in_stock">In stock</a>
        <a href="#/stock/incoming" data-stock="incoming">Incoming</a>
        <a href="#/stock/sold" data-stock="sold">Sold</a>
        <a href="#/stock/returned" data-stock="returned">Returned</a>
        <a href="#/stock/other" data-stock="other">Other</a>
        <a href="#/stock/all" data-stock="">All stock</a>
      </div>
      <a href="#/clients" data-nav="clients" title="Clients"><svg class="i"><use href="#i-clients"/></svg><span class="lbl">Clients</span></a>
      <a href="#/expenses" data-nav="expenses" title="Expenses"><svg class="i"><use href="#i-expenses"/></svg><span class="lbl">Expenses</span></a>
      <a href="#/logistics" data-nav="logistics" title="Logistics"><svg class="i"><use href="#i-logistics"/></svg><span class="lbl">Logistics</span></a>
      <a href="#/accounts" data-nav="accounts" title="Accounts"><svg class="i"><use href="#i-accounts"/></svg><span class="lbl">Accounts</span></a>
      <a href="#/new" data-nav="new" data-role="editor" title="New watch"><svg class="i"><use href="#i-new"/></svg><span class="lbl">New watch</span></a>
      <a href="#/import" data-nav="import" title="Import"><svg class="i"><use href="#i-import"/></svg><span class="lbl">Import</span></a>
      <a href="#/users" data-nav="users" data-role="admin" title="Users"><svg class="i"><use href="#i-users"/></svg><span class="lbl">Users</span></a>
    </nav>
    <div class="side-foot">
      <div class="who" id="who"></div>
      <button class="btn small" id="logout" title="Sign out"><svg class="i"><use href="#i-out"/></svg><span class="lbl">Sign out</span></button>
    </div>
  </aside>
  <div class="page">
